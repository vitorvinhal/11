[package]
name = "desktop"
version = "2.12.2"
edition = "2021"
description = "11 — Inteligência Autônoma (Desktop)"
authors = ["11"]
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
