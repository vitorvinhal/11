name: Security Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm i -g pnpm@8.15.9
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Security regression tests
        run: pnpm --filter @11/web run test -- --testPathPattern="(security|auth-gaps|injection|traversal|ssrf|terminal-validate)"
