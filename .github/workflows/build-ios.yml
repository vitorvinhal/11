name: iOS Build (macOS na nuvem)

# Gera o IPA do app mobile 11 sem precisar de Mac local.
# Requer conta Apple Developer p/ assinatura/distribuição real:
#   - configure segredos MU_PROVISIONING_PROFILE_BASE64 / MU_CERTIFICATE_* (ou use AD-HOC)
#   - por padrão o build é SEM código (CODE_SIGNING_ALLOWED=NO) — IPA de sideload p/ testes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'infra/supabase/migrations/**'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm i -g pnpm@8.15.9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Capacitor add iOS
        working-directory: apps/mobile
        run: |
          test -d ios || npx cap add ios
          npx cap sync ios
        env:
          VITE_WEB_URL: ${{ vars.VITE_WEB_URL }}

      - name: Build app (sem código)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            SCHEME_AUTO_CREATION=YES \
            -resolvePackageDependencies
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            SCHEME_AUTO_CREATION=YES \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar IPA
        working-directory: apps/mobile/ios/App
        run: |
          APP_DIR=$(find build/Build/Products -name '*.app' -maxdepth 2 | head -1)
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr 11-ios-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 11-ios-unsigned-ipa
          path: apps/mobile/ios/App/11-ios-unsigned.ipa
          retention-days: 14